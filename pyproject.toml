# capability reachable by a tenant, an HTTP route, or an AI Control Plane
# tool. Before this contract, nothing stopped `core`, `products`,
# `control_plane`, or `api` from doing `from saas_os.infra.db.backup import
# restore_backup` and exposing it, directly or indirectly, to exactly
# such a caller.
[[tool.importlinter.contracts]]
name = "Backup/restore is not an application-runtime capability"
type = "forbidden"
source_modules = ["saas_os.core", "products", "saas_os.control_plane", "saas_os.api"]
forbidden_modules = ["saas_os.infra.db.backup"]

# RA-12-3: individual identity erasure (saas_os.core.identity.erasure) is a
# destructive, cross-tenant, platform-level capability this repository has
# no general admin-authorization model for yet (saas_os.core.rbac.can() is
# inherently tenant-scoped) -- mirrors the "Backup/restore is not an
# application-runtime capability" contract immediately above exactly: fence
# the capability at the import boundary rather than trust convention alone.
# No API route, Product, or AI Control Plane tool may reach it; only
# trusted ops/admin code (this repository's own tests, today) may call it,
# the same way saas_os.infra.db.backup and saas_os.core.tenancy.purge_tenant() are only
# ever invoked by trusted callers, never a live request path.
# ADR-0045 (and the ADR-0031 amendment of 2026-10-12): platform authority and
# tenant RBAC are two separate authority systems. `can()` never reads a
# platform operator or grant, so no module of `saas_os.core.rbac` may import
# the platform-authority package. Direct imports only
# (`allow_indirect_imports`), the rule ADR-0045 section 5 states and the
# shape of the reverse contract below. Amended 2026-10-12: the contract was
# transitive, which no Core module could satisfy once ADR-0045 section 12a
# is implemented -- `saas_os.core.rbac` imports `saas_os.core.tenancy` and
# `saas_os.core.identity`, and the lifecycle functions there must call
# `authorize_platform_caller`. An indirect path is therefore permitted and is
# not what this contract checks. Which modules may import the package at all
# is pinned separately, module by module, by
# tests/architecture/test_platform_authority_contract.py
# (`_APPROVED_DIRECT_IMPORTERS`); no module of `saas_os.core.rbac` may ever be
# in that list.
[[tool.importlinter.contracts]]
name = "Tenant RBAC does not depend on platform authority"
type = "forbidden"
source_modules = ["saas_os.core.rbac"]
forbidden_modules = ["saas_os.core.platform_authority"]
allow_indirect_imports = true

# The reverse direction: `platform_can()` decides from platform grant storage
# only. The package may not import tenant RBAC, tenancy, billing, feature
# flags, API keys or usage at all. Direct imports only
# (`allow_indirect_imports`): it depends on `saas_os.core.identity` for the
# global `core.users` row, and identity itself reaches those modules.
[[tool.importlinter.contracts]]
name = "Platform authority does not import tenant RBAC or tenant-owned modules"
type = "forbidden"
source_modules = ["saas_os.core.platform_authority"]
forbidden_modules = [
    "saas_os.core.rbac",
    "saas_os.core.tenancy",
    "saas_os.core.billing",
    "saas_os.core.feature_flags",
    "saas_os.core.api_keys",
    "saas_os.core.usage",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Individual identity erasure is not exposed to API, Products, or the AI Control Plane"
type = "forbidden"
source_modules = ["saas_os.api", "products", "saas_os.control_plane"]
forbidden_modules = ["saas_os.core.identity.erasure"]

