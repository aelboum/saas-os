[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-os"
version = "0.1.0"
description = "SaaS OS -- reusable multi-tenant SaaS platform foundation (see docs/ARCHITECTURE.md)."
requires-python = ">=3.13"
readme = "README.md"
license = { text = "UNLICENSED" }

# Runtime dependencies fixed by docs/ADR/0011-backend-language-and-toolchain.md.
# No usage code exists yet for most of these -- declared since Phase 1.1 so the
# project foundation and dependency-boundary tooling (import-linter) can be
# exercised against the accepted stack. See docs/IMPLEMENTATION-ROADMAP.md
# for what is explicitly deferred.
#
# opentelemetry-api/-sdk are new in Phase 2.2: the official OpenTelemetry
# Python packages (docs/ADR/0009-observability-backend.md -- OTel is the
# Accepted instrumentation standard). No exporter-specific package (e.g.
# opentelemetry-exporter-otlp-*) is added -- the console exporter ships
# inside opentelemetry-sdk itself, and OTLP/vendor export is explicitly out
# of scope for this phase (backend vendor remains an open decision).
#
# PyJWT[crypto] is new in Phase 3.2 (docs/ADR/0005-identity-build-vs-buy.md):
# saas_os/core/identity verifies ZITADEL-issued OIDC ID tokens, which are RS256
# (asymmetric) signed -- the `crypto` extra pulls in `cryptography`, which
# PyJWT requires for RS256/ES256 verification (HS256-only, the default,
# cannot validate a JWKS-signed token). PyJWT itself was already an
# installed transitive dependency (of `redis`) but never an explicit,
# relied-upon one before this phase.
#
# httpx is new in Phase 4.3 (docs/IMPLEMENTATION-ROADMAP.md): saas_os/core/webhooks
# makes the actual outbound HTTP delivery call -- "delivery" is this
# phase's own literal objective, and no existing dependency provides an
# outbound HTTP client (fastapi/starlette serve inbound requests; neither
# is a client). httpx is used async (matching saas_os/infra/jobs' async worker
# handlers, so a slow/unreachable subscriber endpoint never blocks the
# worker's event loop the way a synchronous client like `requests` would).
#
# stripe is new in Phase 5.1 (docs/IMPLEMENTATION-ROADMAP.md;
# docs/ADR/0008-billing-provider.md, Accepted: "Stripe as the first
# concrete implementation" of the billing provider-abstraction interface).
# Only `saas_os/core/billing/stripe_provider.py` imports it -- Core/Product code
# depends on `saas_os/core/billing/provider.py`'s provider-agnostic
# `BillingProvider` interface, never this package directly (ADR-0008's
# own binding requirement).
#
# uvicorn is new in P1.8 (docs/DEPLOYMENT-ARCHITECTURE.md section 7): the
# production ASGI server for `saas_os.api.main:app` (`saas_os/api/server.py`). No
# extras (e.g. `uvicorn[standard]`, which pulls in uvloop/httptools/
# watchfiles) -- this repository's deployment model (docs/ADR/0010) is a
# single application process with no hot-reload requirement, so the
# extras would add native-build dependencies for no exercised benefit.
#
# boto3 is new in P2.4 (docs/BACKUP-RESTORE.md): the off-site backup
# destination (saas_os/infra/db/backup/destination.py::S3CompatibleBackupDestination)
# needs a real S3-compatible object-storage client (works against AWS S3,
# MinIO, Backblaze B2, Wasabi, Cloudflare R2, or any other S3-API-compatible
# endpoint via `endpoint_url` -- this repository has not selected a specific
# vendor). Hand-rolling AWS SigV4 request signing to avoid one well-
# maintained official library would be reinventing a wheel with real
# correctness/security risk -- the same "use an established mechanism, do
# not invent it yourself" reasoning P2.4 applies to `age` for encryption.
# Only imported lazily, inside S3CompatibleBackupDestination.__init__ --
# a deployment with off-site storage disabled (BACKUP_OFF_SITE_ENABLED=false,
# the default) never needs it at import time.
#
# cryptography is new as an explicit top-level dependency in S-01
# (BANK-SEC-01/02, docs/ADR/0019-application-level-field-encryption.md):
# `saas_os/core/crypto` imports `cryptography.hazmat.primitives.ciphers.aead.AESGCM`
# directly, for application-level authenticated encryption of sensitive
# database-stored values. Not actually a *new* dependency in the
# resolved-package sense -- `PyJWT[crypto]` already pulls in `cryptography`
# transitively for RS256/ES256 JWT verification (this file's own comment
# on `PyJWT[crypto]` above) -- only made explicit here because Core now
# imports it directly rather than only through PyJWT, the same "declare
# what you actually import" discipline every other entry in this list
# follows. No new package is installed by this line; `pip-audit` already
# scans this exact package/version today.
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "arq>=0.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "PyJWT[crypto]>=2.13",
    "cryptography>=43.0",
    # AI-B decision R4 (ADR-0054): IP-pinned egress (saas_os/infra/egress, and
    # webhook delivery) relies on httpcore passing the `sni_hostname` request
    # extension to `start_tls()` as `server_hostname`. Bounded to the tested
    # lines; `saas_os.infra.egress.compat` refuses to run outside them. Widen
    # only after tests/infra/egress/test_strict_egress_socket_unit.py (real TLS)
    # passes on the new version.
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "uvicorn>=0.30",
]

# docs/ADR/0041-dependency-and-packaging-modularity.md: the two provider SDKs
# that exactly one adapter needs are optional. Importing the platform never
# loads either (tests/architecture/test_optional_sdk_imports.py); each
# adapter raises an ImportError naming its extra when it is used without it.
# The version constraints are the ones these packages had as mandatory
# dependencies -- unchanged.
#
#   pip install "saas-os[stripe]"      core.billing's Stripe adapter
#   pip install "saas-os[s3-backup]"   infra.db.backup's S3-compatible destination
#   pip install "saas-os[all]"         both -- the install set before ADR-0041
[project.optional-dependencies]
stripe = ["stripe>=11.0"]
s3-backup = ["boto3>=1.34"]
all = ["stripe>=11.0", "boto3>=1.34"]
# `dev` carries both provider SDKs: this repository's own test suite
# exercises both adapters, and `pip-audit` (the `security` extra) must keep
# scanning them -- an optional dependency is still a shipped integration.
dev = [
    "pytest>=8.0",
    # Exact pin: `ruff format --check` is a CI gate and formatter output
    # changes between ruff releases, so a floating version fails unrelated
    # pull requests. Raise it deliberately, reformatting in the same change.
    "ruff==0.17.0",
    "pyright>=1.1",
    "import-linter>=2.0",
    "stripe>=11.0",
    "boto3>=1.34",
]
# Security tooling for Phase 1.4 (docs/IMPLEMENTATION-ROADMAP.md): dev-only,
# not part of the runtime image (Dockerfile installs only [project]
# dependencies). pip-audit is the PyPA-maintained dependency-vulnerability
# scanner (queries the OSV database); detect-secrets is Yelp's actively
# maintained secret scanner with a baseline mechanism for false positives.
# Both are single-purpose CLI tools, not a security platform/service.
#
# detect-secrets is pinned to an EXACT version (P2.5, docs/IMPLEMENTATION-
# ROADMAP.md's security-gate hardening) -- unlike every other dev-only tool
# in this file, an unbounded `>=` here is a determinism hazard specific to
# this one package: a future detect-secrets release changing a plugin's
# heuristics (or adding/removing one) can make the exact same repository
# content scan differently, silently drifting local and CI results apart,
# or invalidating `.secrets.baseline`'s own recorded findings without any
# code change. `.secrets.baseline`'s own `"version"` field records the
# version it was generated with (1.5.0); this pin keeps that value true and
# is verified by `tests/architecture/test_secrets_gate.py`.
security = [
    "pip-audit>=2.7",
    "detect-secrets==1.5.0",
]

# ADR-0016: the public, convenience CLI wrapper around
# `saas_os.infra.db.migration_runner.run_core_migrations()` -- a consuming project
# runs `saas-os-migrate upgrade` without knowing the installed package's
# site-packages path, the internal migration-directory layout, or Alembic
# configuration details (Task 4 of the SaaS OS packaging implementation
# phase). The importable function is the real implementation; this script
# is a thin wrapper (`saas_os/infra/db/migration_cli.py`).
[project.scripts]
saas-os-migrate = "saas_os.infra.db.migration_cli:main"
# docs/LOCAL-IDENTITY.md: local-development tooling only -- idempotently
# creates a consuming project's (or SaaS-OS's own) local ZITADEL project and
# public PKCE OIDC application and prints its OIDC_CLIENT_ID, so a consumer
# never copies SaaS-OS's repository files (ADR-0015). Adds no dependency:
# stdlib + `httpx`, already a runtime dependency above.
saas-os-local-identity = "saas_os.infra.local_identity.zitadel_bootstrap:main"
# docs/ADR/0024-single-origin-application-runtime.md: local-development
# tooling only -- emits SaaS-OS's reusable single-origin edge (Caddy)
# configuration so a consuming project does not design its own
# frontend/backend browser-origin proxy, and does not copy this
# repository's files to get one (ADR-0015). Adds no dependency: stdlib
# only, no network call, no secret.
saas-os-edge-config = "saas_os.infra.edge.cli:main"
# docs/AUTO-UPDATE-CLI.md: consumer update tooling only -- moves a consuming
# project's exact-SHA saas-os pin (ADR-0015 rules 7-8) to a newer commit when
# the safety policy (saas_os/infra/update/policy.py) classifies the change SAFE,
# validates it and rolls back on failure. Never commits, pushes or fetches.
# Adds no dependency: stdlib + the `git` executable.
saas-os-update = "saas_os.infra.update.cli:main"
# ADR-0050: packaged operator commands for tenant delete, move and purge and
# for user erasure -- destructive platform operations that are never routes.
saas-os-operator = "saas_os.ops.operator_cli:main"

# --- Package layout -----------------------------------------------------
#
# ADR-0015 rule 1: the shipped `saas-os` package is `core`, `infra`,
# `control_plane`, and `contracts` (plus the reusable parts of `api` --
# ADR-0017) -- `products` is deliberately excluded (ADR-0015 rule 11/12,
# ADR-0015 §9): it is not part of the distributed package and must never
# be. `control_plane` cannot be a top-level directory name on disk because
# docs/ARCHITECTURE.md section 3 fixes the *directory* as `control-plane/`
# (hyphen), which is not a valid Python identifier. The importable package
# therefore lives at `saas_os/control_plane/` and is mapped to the
# import name `control_plane` below. `core`, `infra`, and `contracts` need
# no mapping since their directory name already matches their package
# name. `api` (docs/IMPLEMENTATION-ROADMAP.md Phase 8) is a cross-cutting
# package -- the external API ingress layer/composition root
# (docs/API-ARCHITECTURE.md section 2) -- likewise needs no mapping.
#
# `packages` below is an explicit, flat enumeration of every real package
# directory (one entry per directory that has an `__init__.py`) -- not
# `find:`/`find_namespace:` automatic discovery. This was a deliberate
# choice, not an oversight: an explicit list is fully auditable (a
# reviewer can diff it against `git ls-files '**/__init__.py'` and see
# exactly what a release ships) and structurally cannot silently pick up
# an unrelated top-level directory (`tests/`, `examples/reference-consumer/`
# -- ADR-0018, `frontend/`, `deploy/`, `scripts/`) the way a repo-root
# `find:` scan could the moment any of those directories grows its own
# `__init__.py`. The previous version of this list (`["core", "infra",
# "control_plane", "products", "contracts", "api"]`) was the actual
# packaging defect this comment now guards against: naming only the six
# top-level packages, with no nested entries, silently built wheels that
# excluded every subpackage (`saas_os.core.tenancy`, `saas_os.infra.db`,
# `saas_os.control_plane.orchestration`, etc.) -- confirmed by building a real,
# non-editable wheel and inspecting its contents; `pip install -e .` never
# surfaced this because an editable install exposes the whole source tree
# regardless of what `packages` lists. `tests/test_wheel_contents.py`
# guards against this class of regression going forward. Maintenance
# cost: a new subpackage directory must be added here by hand -- an
# accepted, explicit tradeoff for never silently shipping (or
# silently omitting) the wrong code.
[tool.setuptools]
packages = [
    "saas_os",
    "saas_os.api",
    "saas_os.api.auth",
    "saas_os.api.platform_admin",
    "saas_os.api.v1",
    "saas_os.contracts",
    "saas_os.control_plane",
    "saas_os.control_plane.approvals",
    "saas_os.control_plane.data_authorization",
    "saas_os.control_plane.development",
    "saas_os.control_plane.inference",
    "saas_os.control_plane.inference.adapters",
    "saas_os.control_plane.orchestration",
    "saas_os.control_plane.self_learning",
    "saas_os.control_plane.self_learning.adaptive",
    "saas_os.control_plane.self_learning.autonomous_improvement",
    "saas_os.control_plane.self_learning.continuous_loop",
    "saas_os.control_plane.self_learning.evaluation",
    "saas_os.control_plane.self_learning.experiments",
    "saas_os.control_plane.self_learning.policy_gate",
    "saas_os.control_plane.self_learning.system_learning",
    "saas_os.control_plane.tools",
    "saas_os.core",
    "saas_os.core.api_keys",
    "saas_os.core.audit_digest",
    "saas_os.core.audit_log",
    "saas_os.core.authority",
    "saas_os.core.billing",
    "saas_os.core.config",
    "saas_os.core.crypto",
    "saas_os.core.email",
    "saas_os.core.feature_flags",
    "saas_os.core.idempotency",
    "saas_os.core.identity",
    "saas_os.core.notifications",
    "saas_os.core.outbox",
    "saas_os.core.platform_authority",
    "saas_os.core.rbac",
    "saas_os.core.tenancy",
    "saas_os.core.usage",
    "saas_os.core.webhooks",
    "saas_os.infra",
    "saas_os.infra.db",
    "saas_os.infra.db.backup",
    "saas_os.infra.edge",
    "saas_os.infra.egress",
    "saas_os.infra.health",
    "saas_os.infra.jobs",
    "saas_os.infra.local_identity",
    "saas_os.infra.observability",
    "saas_os.infra.ratelimit",
    "saas_os.infra.secrets",
    "saas_os.infra.update",
    "saas_os.ops",
]

# --- Package data: SaaS OS's own Alembic migration environment ----------
#
# ADR-0016: SaaS OS ships its own `core.*`/`control_plane.*`/
# `self_learning.*` migration history, run by a consuming project via
# `saas_os.infra.db.migration_runner`/the `saas-os-migrate` console script (Task
# 3/4 below) -- never by a consumer reaching into
# `site-packages/saas_os/infra/db/migrations/...` by hand. `saas_os/infra/db/migrations/`
# and `saas_os/infra/db/migrations/versions/` are deliberately NOT Python packages
# (no `__init__.py` -- Alembic script directories are plain-file
# directories, not import targets), so they are shipped as package data,
# not as entries in `packages` above. `env.py` and `script.py.mako` are
# the migration environment itself; `versions/*.py` are the 18 existing
# hand-written revisions (docs/ADR/0016 -- `target_metadata = None`, no
# autogenerate). This `[tool.setuptools.package-data]` table (rather than a
# separate `MANIFEST.in`) is the standard, documented setuptools mechanism
# for shipping non-Python files inside an already-packaged directory
# (`saas_os.infra.db`) -- verified by building a real wheel and inspecting its
# contents (`tests/test_wheel_contents.py`). `.mako` is `script.py.mako`'s
# own extension (Mako template syntax, Alembic's revision-file generator
# template) -- unrelated to any Python package/module name.
[tool.setuptools.package-data]
"saas_os.infra.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
# ADR-0024: the reusable local-development single-origin edge configuration
# `saas-os-edge-config` emits. Same mechanism and same reason as the Alembic
# environment above -- a non-Python file that must actually be present in the
# installed package, because a consuming project obtains it from its
# dependency rather than by copying this repository (ADR-0015). Guarded by
# `tests/test_wheel_contents.py`.
"saas_os.infra.edge" = ["assets/Caddyfile.local-edge"]

# --- Ruff (lint + format) -----------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = [".", "tests", "tests/support", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B008 ("function call in argument default") is FastAPI's own documented,
# intentional dependency-injection pattern (`Depends(...)` as a parameter
# default is how FastAPI resolves the dependency graph -- it is never
# actually evaluated at function-definition time the way a normal mutable
# default argument would be). Scoped to `api/` only, docs/IMPLEMENTATION-ROADMAP.md
# Phase 8 -- this is not a blanket suppression of B008 elsewhere.
[tool.ruff.lint.per-file-ignores]
"saas_os/api/**/*.py" = ["B008"]

# E501: `test_tenant_session_boundary.py`'s `_ALLOWLIST` dict carries a
# trailing `# pragma: allowlist secret` on each entry (detect-secrets'
# Secret Keyword plugin otherwise flags "..._api_key(s)": "..." dict
# entries as false-positive secrets) -- that exact, unbroken phrase is
# what detect-secrets' pragma matcher requires, so it cannot be reflowed
# or noqa'd onto its own line without breaking the allowlisting. Scoped to
# this one file, not a blanket suppression of line length elsewhere.
"tests/architecture/test_tenant_session_boundary.py" = ["E501"]

# --- Pyright (type checking) --------------------------------------------
[tool.pyright]
# `conftest.py` (repository root) is the default test suite's hermetic
# environment shim (post-audit F-01) -- type-checked alongside `tests/`.
include = ["saas_os", "products", "tests", "conftest.py"]
extraPaths = ["examples/reference-consumer", "tests/support"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# --- pytest ---------------------------------------------------------------
# `integration` tests (docs/IMPLEMENTATION-ROADMAP.md Phase 2.1) need a real
# PostgreSQL instance and are excluded from the default run via `-m "not
# integration"` -- the normal validation pipeline (scripts/check-backend.sh,
# CI) must not depend on an external database. Run them explicitly with
# `pytest -m integration` (see tests/infra/test_db_integration.py).
[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test-setup helpers (tests/support/lifecycle_callers.py). Only this
# one directory: `tests/` itself must never be on `sys.path` (conftest.py).
pythonpath = ["tests/support"]
addopts = "-ra -m \"not integration and not packaging\""
markers = [
    "integration: requires a real PostgreSQL instance; excluded by default, see tests/infra/test_db_integration.py",
    "packaging: builds a real wheel and/or installs it into an isolated venv (slow, no database needed); excluded by default, see scripts/check-packaging.sh",
]

# --- import-linter: enforces docs/ARCHITECTURE.md section 2's dependency
# rule (docs/ADR/0001-..., docs/ADR/0011-...) and rule 5, "core MUST NOT
# depend on AI/LLM/agent frameworks". See tests/architecture/ for the
# pytest wrapper that runs these contracts and fails the build if a
# forbidden import is introduced.
#
# `include_external_packages = true` makes grimp (import-linter's analysis
# engine) treat a direct `import openai` (etc.) inside core/ as a graph edge
# even though that package isn't installed -- this is what lets the third
# contract below catch a forbidden AI/LLM import without needing a separate,
# hand-rolled AST scanner as a second, competing enforcement path. Verified
# by temporarily adding `import openai` to core/ and confirming `lint-imports`
# reports it broken (docs/IMPLEMENTATION-ROADMAP.md Phase 1.3).
[tool.importlinter]
# `products` stays a root package here even though it is excluded from
# `[tool.setuptools] packages` above (ADR-0015 rule 11/12: never shipped) --
# import-linter's `forbidden_modules` entries below reference `products` by
# name and require it to be an inspectable root package (`lint-imports`
# errors with "Module 'products' does not exist" otherwise, confirmed
# empirically). This list is internal dev/CI tooling configuration, never
# packaged into the `saas-os` wheel itself, so `products` remaining here
# does not reintroduce it into the distributed package.
root_packages = ["saas_os", "products"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core does not depend on Products or the AI Control Plane"
type = "forbidden"
source_modules = ["saas_os.core"]
forbidden_modules = ["products", "saas_os.control_plane"]

# docs/IMPLEMENTATION-ROADMAP.md Phase 8; docs/API-ARCHITECTURE.md section 2:
# `api` is the external ingress layer/composition root (auth/tenant-resolution/
# RBAC middleware, reusing saas_os.core.identity + saas_os.core.rbac) -- not itself Core,
# Infrastructure, a Product, or the AI Control Plane. Phase 8.1/8.2 exposes no
# AI Control Plane operation over HTTP and no product exists yet
# (saas_os/api/__init__.py's own Non-Goals); this contract makes that property
# enforced, not just documented -- mirrors the shape of the contracts above.
[[tool.importlinter.contracts]]
name = "API does not depend on Products or the AI Control Plane"
type = "forbidden"
source_modules = ["saas_os.api"]
forbidden_modules = ["products", "saas_os.control_plane"]

# docs/IMPLEMENTATION-ROADMAP.md Phase 6.1; docs/ARCHITECTURE.md section 4's
# own Module Ownership table lists `saas_os/contracts/*` as "Cross-cutting (owned by
# Core governance)" -- a standalone package, not nested under any of the
# four layers. It is designed as a dependency-free leaf (saas_os/contracts/__init__.py's
# own docstring): a pure schema/validator with no runtime dependency on Core,
# Infrastructure, Products, or the AI Control Plane. This contract makes that
# property enforced, not just documented -- mirrors the shape of the two
# contracts immediately above.
[[tool.importlinter.contracts]]
name = "Contracts does not depend on Core, Infrastructure, Products, or the AI Control Plane"
type = "forbidden"
source_modules = ["saas_os.contracts"]
forbidden_modules = ["saas_os.core", "saas_os.infra", "saas_os.control_plane", "products"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on Products or the AI Control Plane"
type = "forbidden"
source_modules = ["saas_os.infra"]
forbidden_modules = ["products", "saas_os.control_plane"]

# Genuine architectural boundaries only (docs/ARCHITECTURE.md section 2,
# rule 5) -- not an exhaustive/speculative denylist of every AI SDK that
# could ever exist, just the mainstream ones a developer would realistically
# reach for first. `control_plane` itself is already covered by the first
# contract above, so it is not repeated here.
[[tool.importlinter.contracts]]
name = "Core does not depend on AI or LLM frameworks"
type = "forbidden"
source_modules = ["saas_os.core"]
forbidden_modules = [
    "anthropic",
    "openai",
    "langchain",
    "langchain_core",
    "langchain_community",
    "llama_index",
    "autogen",
    "crewai",
    "semantic_kernel",
    "haystack",
    "transformers",
    "huggingface_hub",
]

# Infrastructure sits below Core in the dependency rule (docs/ARCHITECTURE.md
# section 2: "Product -> SaaS Core -> Infrastructure") -- Core may depend on
# Infra, never the reverse. saas_os/infra/observability (Phase 2.2) is the first
# infra/ subpackage where this direction was actually at risk of being
# gotten backwards, since it would be easy to reach for saas_os/core/config's
# patterns by importing saas_os/core/config directly instead of reading os.environ.
[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on Core"
type = "forbidden"
source_modules = ["saas_os.infra"]
forbidden_modules = ["saas_os.core"]

# Mirrors "Core does not depend on AI or LLM frameworks" above for the same
# rule (docs/ARCHITECTURE.md section 2, rule 5): saas_os/infra/observability must
# remain usable with the AI Control Plane completely disabled.
[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on AI or LLM frameworks"
type = "forbidden"
source_modules = ["saas_os.infra"]
forbidden_modules = [
    "anthropic",
    "openai",
    "langchain",
    "langchain_core",
    "langchain_community",
    "llama_index",
    "autogen",
    "crewai",
    "semantic_kernel",
    "haystack",
    "transformers",
    "huggingface_hub",
]

# Implements docs/MULTI-TENANCY.md section 3, verbatim: "No Core module,
# Product module, or Control Plane tool queries the database directly --
# all go through this layer [saas_os/infra/db]." Before this contract, nothing
# stopped `core`, `products`, or `control_plane` from doing
# `from sqlalchemy import create_engine` (or `sqlalchemy.orm`,
# `sqlalchemy.ext.asyncio`, `psycopg`, `psycopg2`) directly -- confirmed
# empirically by temporarily adding such an import to saas_os/core/__init__.py and
# products/__init__.py and observing `lint-imports` report 3/3 kept, 0
# broken (docs/IMPLEMENTATION-ROADMAP.md Phase 2.1 chokepoint audit).
# `infra` (and so `saas_os/infra/db` itself) is deliberately not a source_module
# here -- it is the one place these libraries are meant to be imported.
[[tool.importlinter.contracts]]
name = "Only infra/db may import SQLAlchemy or psycopg directly"
type = "forbidden"
source_modules = ["saas_os.core", "products", "saas_os.control_plane"]
forbidden_modules = ["sqlalchemy", "psycopg", "psycopg2"]
# docs/IMPLEMENTATION-ROADMAP.md Phase 3.1: the first Core module
# (saas_os/core/tenancy) needs runtime saas_os/infra/db access (session_scope(), and the
# shared ORM base saas_os/infra/db exports so Core can define its own tables
# without importing sqlalchemy itself -- see saas_os/infra/db/orm.py). Since this
# contract is reachability-based (not direct-edge-only), the moment `core`
# is allowed to depend on `saas_os.infra.db` at all, the chain
# `core -> saas_os.infra.db -> saas_os.infra.db.engine -> sqlalchemy` becomes reachable
# and would trip this contract even though core never imports sqlalchemy
# itself -- confirmed empirically by temporarily adding
# `from saas_os.infra.db import session_scope` to saas_os/core/__init__.py before this
# ignore existed. `saas_os.infra.db.role_guard` (P1.2) is the same terminal-edge
# shape: it is exported from `saas_os/infra/db/__init__.py` alongside everything
# else, so the same reachability chain applies to it too.
# `saas_os.infra.db.migration_runner` (SaaS OS packaging implementation phase,
# docs/ADR/0016) is the same terminal-edge shape again -- also re-exported
# from `saas_os/infra/db/__init__.py` (`run_core_migrations`). These five entries
# ignore only the terminal, sanctioned edges (saas_os/infra/db's own internal use
# of sqlalchemy); a direct `core.<anything> -> sqlalchemy` edge is
# untouched by this list and still breaks the contract (proven in
# tests/architecture/test_layer_boundaries.py).
ignore_imports = [
    "saas_os.infra.db.engine -> sqlalchemy",
    "saas_os.infra.db.session -> sqlalchemy",
    "saas_os.infra.db.orm -> sqlalchemy",
    "saas_os.infra.db.role_guard -> sqlalchemy",
    "saas_os.infra.db.migration_runner -> sqlalchemy",
]

# Implements docs/IMPLEMENTATION-ROADMAP.md Phase 2.3: consumers (including
# other infra/ subpackages) use saas_os.infra.secrets's public interface
# (SecretsProvider, get_secrets_provider) -- never its concrete provider
# classes directly. `saas_os.infra.secrets` itself is deliberately not a
# source_module here -- it is the one place these implementations are meant
# to be imported (saas_os/infra/secrets/__init__.py and saas_os/infra/secrets/config.py).
[[tool.importlinter.contracts]]
name = "Only infra/secrets may import its own concrete provider implementations"
type = "forbidden"
source_modules = ["saas_os.core", "products", "saas_os.control_plane", "saas_os.infra.db", "saas_os.infra.observability"]
forbidden_modules = ["saas_os.infra.secrets.providers"]
# import-linter's "forbidden" contract flags reachability, not just a direct
# edge -- without this, any consumer of the sanctioned public interface
# (saas_os.infra.secrets -> saas_os.infra.secrets.config -> saas_os.infra.secrets.providers) would
# trip the contract, since it too "reaches" the forbidden module transitively.
# This ignores exactly the one internal edge that wiring requires, so a
# direct `import saas_os.infra.secrets.providers` from outside saas_os/infra/secrets is
# still caught (proven non-vacuous in tests/architecture/test_layer_boundaries.py).
ignore_imports = ["saas_os.infra.secrets.config -> saas_os.infra.secrets.providers"]

