# The worker's DNS resolver (docs/ADR/0059-controlled-worker-egress.md,
# "DNS for the worker", owner decision of 2026-10-27).
#
# The worker has no outbound route. The application resolves every webhook
# host and api.resend.com itself, judges every address in the answer, and
# hands only a validated IP literal to the egress proxy. This resolver gives
# the worker that resolution, and nothing else:
#
# - It answers only the `worker-dns` network (the worker and itself) and
#   loopback (its own health check); every other client is refused.
# - It recurses from the root, validates DNSSEC (an answer that fails
#   validation is SERVFAIL, so the application treats the name as
#   unresolvable) and minimises query names.
# - It logs no queries, replies or failed names.
# - It does not filter answers: the application refuses an answer set if
#   any address in it is not public, and must see the whole set to do so.

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.31.53.0/28 allow

    # DNSSEC: the root anchor the image's entrypoint refreshes at start
    # (`unbound-anchor`), kept up to date by RFC 5011 while running.
    auto-trust-anchor-file: "/etc/unbound/root.key"
    val-permissive-mode: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes

    # No query logging of any kind.
    verbosity: 0
    log-queries: no
    log-replies: no
    log-servfail: no
    log-local-actions: no
    use-syslog: no
    logfile: ""

    # Bounded memory for the resource limit set in docker-compose.prod.yml.
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    cache-max-ttl: 3600

    # The health check's name, answered locally.
    local-zone: "resolver.check." static
    local-data: "health.resolver.check. A 127.0.0.1"

    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""

remote-control:
    control-enable: no
