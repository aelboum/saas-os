# The worker's egress proxy (docs/ADR/0059-controlled-worker-egress.md).
#
# The worker has no outbound route. Webhook delivery and the Resend adapter
# reach the outside only through this proxy, with `CONNECT <ip>:<port>` to an
# address the application has already resolved and validated
# (`saas_os/infra/egress/proxy.py`). This policy enforces the same limits
# independently, so a defect in the application's check is still contained:
#
# - `CONNECT` only: no plain HTTP forwarding, which would show the proxy the
#   URL; no cache.
# - IP-literal targets only: the proxy never resolves a name.
# - Port 443 only. A product that opts in to `http://` webhook destinations
#   adds 80 here deliberately (ADR-0059 decision 5).
# - Never-public destinations refused, IPv4 and IPv6: the ranges
#   `saas_os.infra.egress.is_non_public_address()` refuses
#   (`tests/architecture/test_egress_proxy_policy.py` checks the two agree).
#   `::ffff:0:0/96` must not be listed: Squid stores IPv4 as IPv4-mapped IPv6,
#   so that entry means 0.0.0.0/0 and collapses the list; a mapped address is
#   judged by its IPv4 form. No entry may overlap another: Squid keeps only
#   one of two overlapping entries, not always the larger. In IPv6 only
#   2000::/3 is global unicast; the rest is listed as Python reports it
#   reserved (`ipaddress`), which `is_non_public_address()` refuses.
# - The access log records the time, the client, the method, the
#   destination IP and port and the result: never a URL, header or body.
#
# Squid runs as the `proxy` user, which cannot open /dev/stdout; logs go to
# /var/log/squid (a tmpfs in the reference topology).

http_port 3128

acl CONNECT method CONNECT
cache deny all

acl ip_literal_v4 dstdom_regex -n ^[0-9]{1,3}(\.[0-9]{1,3}){3}$
acl ip_literal_v6 dstdom_regex -n ^\[?[0-9a-fA-F:.]+\]?$

acl egress_ports port 443

acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
# ::/8 without ::ffff:0:0/96 (see above): Squid would read ::/8 as covering all IPv4.
acl blocked_dst dst ::/81 ::8000:0:0/82 ::c000:0:0/83 ::e000:0:0/84 ::f000:0:0/85 ::f800:0:0/86 ::fc00:0:0/87 ::fe00:0:0/88 ::ff00:0:0/89 ::ff80:0:0/90 ::ffc0:0:0/91 ::ffe0:0:0/92 ::fff0:0:0/93 ::fff8:0:0/94 ::fffc:0:0/95 ::fffe:0:0/96 ::1:0:0:0/80 ::2:0:0:0/79 ::4:0:0:0/78 ::8:0:0:0/77 ::10:0:0:0/76 ::20:0:0:0/75 ::40:0:0:0/74 ::80:0:0:0/73 ::100:0:0:0/72 ::200:0:0:0/71 ::400:0:0:0/70 ::800:0:0:0/69 ::1000:0:0:0/68 ::2000:0:0:0/67 ::4000:0:0:0/66 ::8000:0:0:0/65 0:0:0:1::/64 0:0:0:2::/63 0:0:0:4::/62 0:0:0:8::/61 0:0:0:10::/60 0:0:0:20::/59 0:0:0:40::/58 0:0:0:80::/57 0:0:0:100::/56 0:0:0:200::/55 0:0:0:400::/54 0:0:0:800::/53 0:0:0:1000::/52 0:0:0:2000::/51 0:0:0:4000::/50 0:0:0:8000::/49 0:0:1::/48 0:0:2::/47 0:0:4::/46 0:0:8::/45 0:0:10::/44 0:0:20::/43 0:0:40::/42 0:0:80::/41 0:0:100::/40 0:0:200::/39 0:0:400::/38 0:0:800::/37 0:0:1000::/36 0:0:2000::/35 0:0:4000::/34 0:0:8000::/33 0:1::/32 0:2::/31 0:4::/30 0:8::/29 0:10::/28 0:20::/27 0:40::/26 0:80::/25 0:100::/24 0:200::/23 0:400::/22 0:800::/21 0:1000::/20 0:2000::/19 0:4000::/18 0:8000::/17 1::/16 2::/15 4::/14 8::/13 10::/12 20::/11 40::/10 80::/9
acl blocked_dst dst 100::/8 200::/7 400::/6 800::/5 1000::/4 2001::/23 2001:db8::/32 2002::/16 3fff::/20 4000::/3 6000::/3 8000::/3 a000::/3 c000::/3 e000::/4 f000::/5 f800::/6 fc00::/7 fe00::/9 fe80::/10 fec0::/10 ff00::/8

http_access deny !CONNECT
http_access deny !egress_ports
http_access deny !ip_literal_v4 !ip_literal_v6
http_access deny blocked_dst
http_access allow CONNECT
http_access deny all

logformat egress %ts.%03tu %>a %rm %<a:%<p %>Hs %Ss
access_log stdio:/var/log/squid/access.log egress
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
