# P2.3 -- the production network perimeter. A standalone file (not a
# `docker-compose.yml` override): every service is fully declared here
# rather than relying on Compose's list-replacement merge semantics for a
# security-critical property (which ports are and are not published) --
# this file is independently readable and independently testable
# (`scripts/check-docker-prod.sh`), and `docker-compose.yml` itself is
# completely untouched by P2.3 (the local development experience does not
# change: `docker compose up` still works exactly as before).
#
# Run with:
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Topology (docs/DEPLOYMENT-ARCHITECTURE.md P2.3 section):
#
#     INTERNET -> :80/:443 -> proxy (Caddy) -> frontend (edge)
#                                            -> backend (edge + internal + identity-edge)
#                                                          -> postgres (internal)
#                                                          -> redis (internal)
#                                            -> zitadel (identity-edge + identity-db)
#                                                          -> zitadel-db (identity-db)
#                             worker (internal only) -> postgres, redis
#
# Four Docker networks -- `edge` (proxy, frontend, backend), `internal`
# (backend, worker, postgres, redis), and, since ADR-0023 Phase 3,
# `identity-edge` (proxy, backend, zitadel, zitadel-bootstrap) +
# `identity-db` (zitadel, zitadel-db). PostgreSQL, Redis, and the worker
# never join `edge` or either identity network; ZITADEL and its own
# database never join `edge`/`internal`; `backend` joins `identity-edge`
# but deliberately NOT `identity-db` -- it needs to reach ZITADEL's OIDC
# endpoints, never ZITADEL's own database. Only the proxy publishes a host
# port. This is the actual enforcement mechanism this checkpoint's own
# (and the identity topology's own, docs/DEPLOYMENT-ARCHITECTURE.md's
# identity section) network/perimeter tests verify -- a service with no
# `ports:` entry and no membership in `edge` is unreachable from outside
# its own network by construction, not merely by a documented intention.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    # No `ports:` -- PostgreSQL is reachable only as `db:5432` from a
    # container on the `internal` network (this checkpoint's own P2.3
    # objective 2). Omitting host publication entirely, rather than
    # binding a specific interface, also means there is no IPv4 *or*
    # IPv6 host exposure to reason about (objective 12).
    networks:
      - internal
    volumes:
      - db-data-prod:/var/lib/postgresql/data
      - ./infra/db/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No `ports:` -- Redis is reachable only as `redis:6379` from a
    # container on the `internal` network (objective 3), unchanged from
    # P2.3. P2.4 adds AOF persistence on a named durable volume: ARQ's
    # queued/in-flight job state (P2.1) previously lived only in the
    # container's writable layer, meaning a container recreate (not just
    # a restart) silently dropped any not-yet-executed job. `appendonly
    # yes` with the default `everysec` fsync policy bounds that loss to
    # at most ~1s of enqueues even across a full recreate -- see
    # docs/BACKUP-RESTORE.md's Redis section for what this does and does
    # not guarantee (rate-limit counters are disposable cache, not
    # durable state; a queued job's entry carries the payload the job
    # needs, transiently and bounded by ARQ's own expiry; a completed
    # job's *result* is never retained in Redis -- PRIV-03 P10 / RA-06,
    # `infra/jobs` runs ARQ with `keep_result=0` -- so application state
    # a job produces exists only in PostgreSQL).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data-prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # CP-07 J-INFRA-04: set here, not left to the operator's own `.env`
      # (`env_file:` above) -- a top-level `environment:` entry always
      # overrides the same key from `env_file:`, regardless of an
      # operator's `.env` (even one copied verbatim from `.env.example`,
      # which ships `ENVIRONMENT=development` as its own local-dev
      # default). `infra.secrets.config._provider_from_env()` now refuses
      # to run at all with `ENVIRONMENT` unset (no more silent default),
      # but an *explicit*, merely wrong value -- e.g. an unedited
      # `.env.example` copy -- would otherwise still silently select the
      # permissive, `.env`-file-reading development posture in this,
      # this repository's one shipped production topology.
      ENVIRONMENT: production
      # ADR-0024: the browser-visible application origin, derived here from
      # `PUBLIC_DOMAIN` (the one hostname Caddy already terminates TLS for
      # and routes, below) rather than maintained as a second, independently
      # editable value that could drift from it. `api/auth/config.py`
      # derives this deployment's OIDC callback from it
      # (`https://${PUBLIC_DOMAIN}/auth/callback`), so the redirect URI, the
      # proxied origin and the certificate's own hostname are one fact. An
      # operator `.env` that also sets OIDC_REDIRECT_URI must agree with it
      # or the backend fails closed at configuration time -- never silent
      # precedence (infra/edge/origin.py).
      PUBLIC_APP_ORIGIN: https://${PUBLIC_DOMAIN}
      # S-05 (docs/ADR/0021-database-redis-transport-encryption.md):
      # deliberately NOT set here. `DB_REQUIRE_TLS`/`REDIS_REQUIRE_TLS`
      # already default to true whenever ENVIRONMENT=production
      # (infra/db/config.py, infra/jobs/config.py, infra/ratelimit/
      # config.py) -- this reference deployment does not provide a
      # plaintext production opt-out. The stock postgres:16-alpine/
      # redis:7-alpine images this compose file uses ship with TLS off by
      # default, so `db`/`redis` here need a TLS-capable DATABASE_URL/
      # REDIS_URL (a managed database/cache with TLS, or an operator-
      # provisioned certificate on these containers) before `backend`/
      # `worker` can connect -- provisioning and deploying that TLS
      # material is operational infrastructure, out of this repository's
      # own scope (see the ADR's "Residual Limitation").
      # Non-secret, production-only: only this compose file ever sets
      # this to true (module docstring, api/auth/routes.py) -- the
      # development compose (docker-compose.yml) never does, so the
      # existing dev/test request.client.host behavior is unchanged
      # there. Trusting X-Forwarded-For is safe here specifically
      # because `backend` has no host-published port and is reachable
      # only via `edge` (from `proxy`) or `internal` (from `worker`) --
      # a request from the public Internet can only ever reach this
      # container through Caddy, which is the one hop this setting
      # trusts.
      TRUST_PROXY_HEADERS: "true"
      # ADR-0023 Phase 3: `core/identity/provider.py`'s discovery/JWKS/
      # token-exchange calls (unchanged code -- `httpx`'s and
      # `urllib.request`'s own default TLS verification already honor this
      # standard variable, verified empirically) need to trust the
      # self-signed certificate ZITADEL terminates its own TLS with for the
      # direct `identity-edge` connection below -- see
      # `deploy/generate-identity-tls-cert.sh`'s own module docstring for
      # why this exists instead of a Caddy hairpin.
      SSL_CERT_FILE: /identity-ca/tls.crt
    # No `ports:` -- the reverse proxy reaches the backend as
    # `backend:8000` over `edge`; the backend reaches PostgreSQL/Redis as
    # `db:5432`/`redis:6379` over `internal` (objective 8); the backend
    # reaches ZITADEL directly (discovery/JWKS/token-exchange only -- never
    # ZITADEL's own database, never its Management API) as
    # `https://${IDENTITY_PUBLIC_DOMAIN}` over `identity-edge` (ADR-0023
    # Phase 3), resolved by ZITADEL's own network alias on that network,
    # below -- deliberately NOT `identity-db`; `backend` has no legitimate
    # reason to reach `zitadel-db` and must not be able to. Same non-root
    # image/user as the development topology (Dockerfile is unchanged).
    volumes:
      - identity-ca:/identity-ca:ro
    networks:
      - edge
      - internal
      - identity-edge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT `zitadel` here -- core/identity's own OIDC
      # discovery is resolved lazily on first `/auth/login`, not at
      # process startup (Phase 2, unchanged); coupling backend's own
      # container-healthy signal to a service it doesn't need yet at
      # startup would be unnecessary startup-ordering coupling (the same
      # reasoning `docker-compose.yml`'s own Phase 1 `zitadel` service
      # comment already states -- unchanged by this phase).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request as u; u.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "api.worker"]
    env_file:
      - .env
    environment:
      # CP-07 J-INFRA-04: see `backend`'s own identical entry above --
      # the worker reads the same `infra.secrets`/`infra.jobs` configuration
      # and must never silently run as development either.
      ENVIRONMENT: production
      # S-05: see `backend`'s own identical comment above -- no opt-out
      # here either, same TLS requirement, same operator responsibility.
    # `internal` only -- the worker (P2.1) makes no inbound HTTP surface
    # and needs no edge connectivity (this checkpoint's own "the worker
    # should not join the edge network unless there is a demonstrated
    # requirement" -- none exists). Unchanged from P2.1 otherwise.
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "api.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    # No `ports:` -- reachable only through the proxy on `edge`
    # (objective: "frontend reachable through proxy only").
    networks:
      - edge
    restart: unless-stopped

  # The one service permitted to publish a host port (objective 5/15).
  # Official Caddy image runs its master process as root (needed to bind
  # :80/:443, which the image's own binary is `setcap`'d for) -- there is
  # no unprivileged user shipped in this image to switch to instead, so
  # capabilities are dropped to the single one actually required rather
  # than left at the image's full default set (objective 15's "do not add
  # unnecessary Linux capabilities" -- applied here as "remove every
  # capability not required, keep exactly one").
  proxy:
    # Pinned exact version (ADR-0025 §9): the provider-cookie stripping and
    # upstream Host handling in ./Caddyfile and deploy/caddy/ were verified
    # against exactly this release -- never a floating `2-alpine` tag (Caddy
    # v2.11.0 changed the default Host sent to HTTPS upstreams, which ZITADEL
    # uses to resolve its instance; the profiles now set it explicitly).
    image: caddy:2.11.4-alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
    environment:
      # `env_file:` alone does not receive Compose's own shell/`.env`
      # *interpolation* (the `${...}` substitution Compose performs on the
      # compose file itself, which does honor a shell-level override --
      # e.g. `scripts/check-docker-prod.sh`'s `PUBLIC_DOMAIN=localhost`
      # prefix for deterministic local TLS testing) -- this line is what
      # actually forwards the resolved value into the container for
      # Caddy's own `{$PUBLIC_DOMAIN}` substitution in ./Caddyfile.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      # ADR-0023 Phase 3: forwarded the same way `PUBLIC_DOMAIN` is, for
      # the Caddyfile's own second, identity site block's
      # `{$IDENTITY_PUBLIC_DOMAIN}` substitution.
      IDENTITY_PUBLIC_DOMAIN: ${IDENTITY_PUBLIC_DOMAIN}
      # ADR-0025 §1a: selects ./deploy/caddy/identity-profile-<profile>.caddyfile.
      # Defaults to the compatibility profile, so an existing deployment
      # that never sets it keeps its ADR-0023 §9 identity domain unchanged.
      IDENTITY_PROFILE: ${IDENTITY_PROFILE:-existing}
    ports:
      - "80:80"
      - "443:443"
    # `identity-edge` (ADR-0023 Phase 3): the only route to ZITADEL, which
    # publishes no host port of its own -- the browser's OIDC
    # authorization-redirect leg reaches ZITADEL exclusively through this
    # proxy, exactly like every other public route in this file.
    networks:
      - edge
      - identity-edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy:/etc/caddy/identity-profiles:ro
      # ZITADEL's internal TLS certificate (no key), so the fresh profile's
      # ZITADEL upstream is verified rather than skipped.
      - identity-ca:/identity-ca:ro
      # Persistent, named volumes for ACME certificates/account state and
      # Caddy's own config cache (objective 16) -- never ephemeral
      # container storage, never a path under the repository, never a
      # committed file.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      # ADR-0023 Phase 3: unlike `backend` (deliberately not gated on
      # ZITADEL -- lazy OIDC discovery, unchanged), Caddy is a pure proxy
      # with no application logic of its own; waiting here only delays
      # Caddy's own startup until ZITADEL can actually serve the identity
      # site, avoiding a brief post-deploy window of failed logins.
      zitadel:
        condition: service_healthy
      zitadel-login:
        condition: service_started
    healthcheck:
      # Caddy's admin API (loopback-only inside the container, never
      # published) -- a minimal, dependency-free liveness probe using the
      # `caddy` binary itself, already present in every layer this image
      # needs regardless (mirrors Dockerfile's own "no new package solely
      # for a health check" reasoning).
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    # Caddy's default entrypoint forwards SIGTERM to a graceful shutdown
    # (drains connections, then exits) -- no extra `stop_signal`/
    # `stop_grace_period` override needed (objective 5's "support graceful
    # shutdown").

  # --- Production self-hosted identity (ADR-0023 Phase 3) --------------------
  #
  # Reuses the exact ZITADEL version and startup model Phase 1 already
  # validated locally (docker-compose.yml) -- pinned v4.19.0,
  # `start-from-init`, the same FirstInstance/PAT bootstrap mechanism --
  # extended here with the production-only concerns local dev has no need
  # for: no host port at all (ZITADEL is reachable exclusively through
  # Caddy for the browser, and directly over `identity-edge` for
  # `backend`/`zitadel-bootstrap` -- never from the public Internet), a
  # dedicated `identity-db`-only database, and TLS ZITADEL terminates
  # itself for that direct internal leg (see `identity-tls-init` below for
  # why).

  # Generates the self-signed certificate ZITADEL terminates its own TLS
  # with (see `deploy/generate-identity-tls-cert.sh`'s own docstring for
  # the full reasoning). Idempotent -- reuses an existing certificate
  # across restarts rather than rotating it every deploy.
  identity-tls-init:
    image: alpine/openssl:3.5.8
    entrypoint: ["sh", "/deploy/generate-identity-tls-cert.sh"]
    environment:
      IDENTITY_PUBLIC_DOMAIN: ${IDENTITY_PUBLIC_DOMAIN}
    volumes:
      - identity-tls-server:/identity-tls-server
      - identity-ca:/identity-ca
      - ./deploy/generate-identity-tls-cert.sh:/deploy/generate-identity-tls-cert.sh:ro
    depends_on:
      identity-profile-guard:
        condition: service_completed_successfully

  # ADR-0025 §1a: fail-closed check of the identity deployment profile
  # (`fresh` = ZITADEL on PUBLIC_DOMAIN, `existing` = ZITADEL on its own
  # IDENTITY_PUBLIC_DOMAIN). Pins the profile and both domains on first run
  # and refuses any later change, so no configuration edit can silently
  # move an existing deployment's issuer or WebAuthn/U2F RP ID. Runs before
  # any identity TLS material exists for a new deployment -- see the
  # script's own docstring.
  identity-profile-guard:
    image: alpine/openssl:3.5.8
    entrypoint: ["sh", "/deploy/check-identity-profile.sh"]
    environment:
      IDENTITY_PROFILE: ${IDENTITY_PROFILE:-existing}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      IDENTITY_PUBLIC_DOMAIN: ${IDENTITY_PUBLIC_DOMAIN}
    network_mode: none
    volumes:
      - identity-profile-state:/identity-profile-state
      - identity-tls-server:/identity-tls-server:ro
      # Read-only, existence check only (`PG_VERSION`): an initialized
      # ZITADEL database means an identity deployment -- issuer, passkeys,
      # U2F -- already exists (see the script). No network, no credentials.
      - zitadel-db-data-prod:/zitadel-db-data:ro
      - ./deploy/check-identity-profile.sh:/deploy/check-identity-profile.sh:ro

  # ADR-0025 §7 (Decision 4): deploy-time RSA keypair for the Login V2
  # service's ZITADEL system-API user. The private half lives only in
  # `login-client-private` (mounted only into `zitadel-login`), the public
  # half only in `login-client-public` (mounted only into `zitadel`). See
  # deploy/generate-login-client-key.sh.
  login-client-key-init:
    image: alpine/openssl:3.5.8
    entrypoint: ["sh", "/deploy/generate-login-client-key.sh"]
    network_mode: none
    volumes:
      - login-client-private:/login-client-private
      - login-client-public:/login-client-public
      - ./deploy/generate-login-client-key.sh:/deploy/generate-login-client-key.sh:ro

  # ZITADEL's own process image has no shell and no `chown`/`chmod` binary
  # (distroless-style) and runs as a non-root user -- identical constraint,
  # identical fix, to docker-compose.yml's own Phase 1
  # `zitadel-bootstrap-vol-init` (verified empirically there; unchanged
  # here).
  zitadel-bootstrap-vol-init:
    # F-08 (platform readiness audit): pinned exact version, never
    # implicit `latest` -- same convention as every other image in this
    # file (postgres:16-alpine, redis:7-alpine, caddy:2.11.4-alpine,
    # ghcr.io/zitadel/zitadel:v4.19.0).
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - zitadel-bootstrap-prod:/bootstrap

  # Dedicated PostgreSQL, structurally separate from the SaaS-OS `db`
  # service above -- own credentials, own volume, `identity-db` only (no
  # `internal`, no `edge`, no host port). ZITADEL manages its own
  # schema/migrations independently; it must never join SaaS-OS's Alembic
  # history (ADR-0023 S5, unchanged since Phase 1).
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    # No `ports:` -- reachable only as `zitadel-db:5432`, only from
    # `zitadel` itself, only on `identity-db`. `backend`/`worker` are not
    # members of this network and cannot reach it regardless of
    # credentials they do not hold either.
    networks:
      - identity-db
    volumes:
      - zitadel-db-data-prod:/var/lib/postgresql/data
    # ADR-0025 §1a: the profile guard must see this volume before PostgreSQL
    # ever initializes it, so a brand-new deployment is pinned first.
    depends_on:
      identity-profile-guard:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zitadel:
    # Pinned exact version (never `latest`) -- the same v4.19.0 Phase 1
    # already validated. Do not upgrade as part of this phase.
    image: ghcr.io/zitadel/zitadel:v4.19.0
    # No `--tlsMode` flag here (unlike Phase 1's local `--tlsMode
    # disabled`) -- TLS is configured entirely through the
    # ZITADEL_TLS_*/ZITADEL_PORT environment variables below.
    # `--config` adds only the Login V2 system-API user (ADR-0025 §7;
    # deploy/zitadel-login-client-system-user.yaml -- a public-key path and
    # the documented IAM_LOGIN_CLIENT role, no key material).
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --config /zitadel-config/login-client-system-user.yaml
    # Needed to bind the privileged port ZITADEL's own internal TLS
    # listener uses below (443) -- the image runs as a fixed, non-root
    # user (verified empirically: `docker image inspect` reports `User:
    # zitadel`), the same reason the `proxy` service above already needs
    # this identical capability for its own privileged-port bind.
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # Admin == User here (ZITADEL then skips creating a second Postgres
      # role) -- unlike the SaaS-OS `db` service's own POSTGRES_USER/
      # APP_DB_USER split, this collapse is safe: that split exists
      # specifically for PostgreSQL RLS enforcement, which is irrelevant
      # to ZITADEL's own schema (identical reasoning to Phase 1's local
      # `zitadel` service).
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Network isolation (`identity-db`, no host port) is this
      # deployment's primary control for the ZITADEL<->zitadel-db
      # transport, the same posture docs/ADR/0021-database-redis-
      # transport-encryption.md already accepts for the SaaS DB's own
      # stock postgres:16-alpine image (no TLS certificate provisioned by
      # this repository) -- an operator wanting DB-transport TLS here too
      # supplies a TLS-capable Postgres endpoint themselves, same residual
      # limitation, not a new one.
      #
      # ExternalDomain/-Port/-Secure is what the browser sees (through
      # Caddy) and what backend/zitadel-bootstrap see (directly, over
      # identity-edge) -- the SAME URL either way (ADR-0023 Phase 3's own
      # "same-domain identity strategy"). It MUST match OIDC_ISSUER_URL
      # (.env) exactly, or core/identity/oidc.py's issuer check rejects
      # every token.
      ZITADEL_EXTERNALDOMAIN: ${IDENTITY_PUBLIC_DOMAIN}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      # ZITADEL terminates its own TLS here (unlike Phase 1's local
      # `ZITADEL_TLS_ENABLED=false`) -- verified empirically against this
      # pinned version/config to start cleanly and report healthy via
      # `/app/zitadel ready`. See `deploy/generate-identity-tls-cert.sh`'s
      # own docstring for the full "why" (backend/zitadel-bootstrap must
      # reach this exact https://${IDENTITY_PUBLIC_DOMAIN} URL directly,
      # over `identity-edge`, without hairpinning through Caddy).
      ZITADEL_TLS_ENABLED: "true"
      ZITADEL_TLS_CERTPATH: /identity-tls-server/tls.crt
      ZITADEL_TLS_KEYPATH: /identity-tls-server/tls.key
      # Equal to ZITADEL_EXTERNALPORT -- the container's own internal
      # listener must be reachable at the exact same "host:port" the
      # alias below resolves for `backend`/`zitadel-bootstrap`'s direct
      # connection (identical reasoning to Phase 1's local `ZITADEL_PORT`
      # comment, just with 443 instead of a >1024 dev port, hence
      # `cap_add: NET_BIND_SERVICE` above).
      ZITADEL_PORT: "443"
      # Deterministic first-run bootstrap (ZITADEL's own supported
      # mechanism -- no custom provisioning), identical shape to Phase 1's
      # local `zitadel` service. Org name is a fixed, non-secret
      # identifier (no "-local" suffix, unlike Phase 1's own literal, for
      # obvious reasons) -- only the admin password is a secret, sourced
      # from .env.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: saas-os
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # A machine user + Personal Access Token, IAM_OWNER-scoped, created
      # at bootstrap and written to ZITADEL_FIRSTINSTANCE_PATPATH -- the
      # credential `zitadel-bootstrap` (below) uses to create the SaaS-OS
      # OIDC application via ZITADEL's own Management API. The token value
      # itself is generated by ZITADEL, never supplied by this repo, and
      # is never given to `backend` (see `zitadel-bootstrap`'s own
      # comments).
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # ZITADEL v4 would otherwise require Login V2 instance-wide for every
      # application. ADR-0025 keeps this "false" in BOTH profiles: Login V2
      # (the `zitadel-login` service below) is enabled per application instead,
      # through the application's own `loginVersion.loginV2.baseUri`
      # (deploy/bootstrap_zitadel_production.py) -- ZITADEL ignores that
      # per-application setting while this instance-wide flag is "true".
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    # No `ports:` -- ZITADEL is reachable only through Caddy (the browser)
    # and directly over `identity-edge` (backend/zitadel-bootstrap). Never
    # a host port, in any environment (ADR-0023 Phase 3's own explicit
    # requirement).
    volumes:
      - identity-tls-server:/identity-tls-server:ro
      - zitadel-bootstrap-prod:/bootstrap
      - login-client-public:/login-client-public:ro
      - ./deploy/zitadel-login-client-system-user.yaml:/zitadel-config/login-client-system-user.yaml:ro
    networks:
      identity-edge:
        # The one alias that makes `https://${IDENTITY_PUBLIC_DOMAIN}`
        # resolve directly to this container from `backend`/
        # `zitadel-bootstrap`, without hairpinning through Caddy --
        # identical mechanism to Phase 1's local `zitadel.localhost`
        # alias, just with the production hostname substituted.
        aliases:
          - ${IDENTITY_PUBLIC_DOMAIN}
      identity-db:
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-vol-init:
        condition: service_completed_successfully
      identity-tls-init:
        condition: service_completed_successfully
      login-client-key-init:
        condition: service_completed_successfully
    healthcheck:
      # Same mechanism Phase 1 already validated -- ZITADEL's image has no
      # shell/curl; `zitadel ready` is its own supported readiness probe.
      # Verified empirically against this exact TLS-enabled configuration
      # (self-signed certificate, ZITADEL_TLS_ENABLED=true) to report
      # healthy correctly.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # ADR-0025: ZITADEL's official Login V2 artifact, pinned to the same
  # v4.19.0 release as `zitadel` (built for, and only ever served at, the
  # documented `/ui/v2/login` path -- no custom build). Caddy routes
  # `/ui/v2/login` on ZITADEL's own public domain here: PUBLIC_DOMAIN in the
  # fresh profile, IDENTITY_PUBLIC_DOMAIN in the existing one (identical
  # values in the fresh profile, see deploy/check-identity-profile.sh).
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.19.0
    environment:
      # ZITADEL's API over `identity-edge`, via the `zitadel` alias -- the
      # same URL/TLS path `backend`/`zitadel-bootstrap` use.
      ZITADEL_API_URL: https://${IDENTITY_PUBLIC_DOMAIN}
      # Trusts ZITADEL's internal TLS certificate (the image's own
      # SSL_CERT_DIR preload) -- verification stays enabled.
      SSL_CERT_DIR: /identity-ca
      # System-user JWT authentication (ZITADEL v4.19.0
      # self-hosting/manage/adopt-login-v2.mdx §2; ADR-0025 §7). The key is
      # generated at deploy time by `login-client-key-init`; no PAT and no
      # key material in this file or in .env.
      SYSTEM_USER_ID: login-client
      SYSTEM_USER_PRIVATE_KEY_FILE: /login-client-private/login-client.pem
      AUDIENCE: https://${IDENTITY_PUBLIC_DOMAIN}
    volumes:
      # The ONLY service that mounts the Login V2 private key.
      - login-client-private:/login-client-private:ro
      - identity-ca:/identity-ca:ro
    # `identity-edge` only: reachable from Caddy, and reaches ZITADEL; no
    # SaaS-OS network, no host port.
    networks:
      - identity-edge
    depends_on:
      zitadel:
        condition: service_healthy
      login-client-key-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot, idempotent (local-dev/bootstrap_zitadel.py: list-before-create
  # by name, safe to re-run on every deploy). Never restart-managed as a
  # permanent service -- runs once, exits, same as Phase 1's local
  # `zitadel-bootstrap`. Reuses that exact script (unmodified) through the
  # small `deploy/bootstrap_zitadel_production.py` wrapper -- see that
  # file's own docstring for why a wrapper exists at all (documentation
  # accuracy, not because the underlying provisioning logic needed
  # changing). Holds the only Management-API-capable credential in this
  # topology (the PAT ZITADEL itself wrote to the shared, `:ro`-mounted
  # `zitadel-bootstrap-prod` volume) -- `backend` never receives it.
  zitadel-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "/deploy/bootstrap_zitadel_production.py"]
    environment:
      # Same URL backend/the browser use (see `zitadel`'s own
      # `networks.identity-edge.aliases` comment above for why that's
      # required, not just convenient).
      ZITADEL_INTERNAL_URL: https://${IDENTITY_PUBLIC_DOMAIN}
      # ADR-0024: the same derivation `backend` uses above -- the callback
      # registered with ZITADEL and the one the backend sends in the token
      # exchange come from one value, `PUBLIC_DOMAIN`.
      PUBLIC_APP_ORIGIN: https://${PUBLIC_DOMAIN}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # See `backend`'s own identical entry above -- trusts ZITADEL's
      # self-signed internal TLS certificate for this same direct
      # `identity-edge` connection.
      SSL_CERT_FILE: /identity-ca/tls.crt
      # ADR-0025 §1a: the bootstrap wrapper derives the application's Login
      # V2 base URI from these (fresh: https://${PUBLIC_DOMAIN}/ui/v2/login;
      # existing: unchanged Login V1 unless ZITADEL_LOGIN_V2_ENABLED=true).
      IDENTITY_PROFILE: ${IDENTITY_PROFILE:-existing}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      IDENTITY_PUBLIC_DOMAIN: ${IDENTITY_PUBLIC_DOMAIN}
      ZITADEL_LOGIN_V2_ENABLED: ${ZITADEL_LOGIN_V2_ENABLED:-false}
    volumes:
      - zitadel-bootstrap-prod:/bootstrap:ro
      - identity-ca:/identity-ca:ro
      - ./local-dev/bootstrap_zitadel.py:/local-dev/bootstrap_zitadel.py:ro
      - ./deploy/bootstrap_zitadel_production.py:/deploy/bootstrap_zitadel_production.py:ro
    # `identity-edge` only -- never `identity-db` (no reason to reach
    # ZITADEL's own database) and never `edge`/`internal` (no reason to
    # reach the SaaS application's own services).
    networks:
      - identity-edge
    depends_on:
      zitadel:
        condition: service_healthy

networks:
  edge:
  # `internal: true` is Docker's own network-level hardening: containers on
  # this network get no default route to the Internet at all (not merely
  # "no published port") -- db/redis/worker, which never need outbound
  # Internet access, cannot reach it even if something inside them tried.
  # `backend` still bridges `edge` <-> `internal` normally by being a
  # member of both networks; `internal: true` only removes the *external*
  # gateway from this network, not inter-network routing through a
  # dual-homed container.
  internal:
    internal: true
  # ADR-0023 Phase 3: the same `internal: true` hardening as `internal`
  # above, applied to the identity topology. `proxy`/`backend` are also
  # members of `edge`/`internal` respectively, so their own outbound
  # routes are unaffected; `zitadel`/`zitadel-bootstrap` have no other
  # network membership and lose outbound Internet access entirely (a
  # privacy/security improvement, not a regression -- ZITADEL needs none
  # of its own optional telemetry to function in this deployment).
  identity-edge:
    internal: true
  identity-db:
    internal: true

volumes:
  db-data-prod:
  redis-data-prod:
  caddy-data:
  caddy-config:
  zitadel-db-data-prod:
  zitadel-bootstrap-prod:
  identity-tls-server:
  identity-ca:
  identity-profile-state:
  login-client-private:
  login-client-public:
