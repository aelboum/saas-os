# Minimal development-oriented Docker foundation, consistent with
# docs/ADR/0010-deployment-target.md (Docker + Docker Compose + VPS) and
# docs/ADR/0012-secrets-management.md.
#
# NOT the full production deployment (docs/DEPLOYMENT-ARCHITECTURE.md) --
# no Kubernetes, no Vault, no external secrets manager, no production
# credentials. All secrets come from a local, gitignored `.env` file (copy
# `.env.example` to `.env` and fill in local-only values) -- none are
# hardcoded or defaulted in this file.
#
# Two distinct PostgreSQL roles (docs/IMPLEMENTATION-ROADMAP.md Phase 3.1
# security correction -- PostgreSQL RLS is never applied to a superuser or
# a BYPASSRLS role, no override exists):
#   - POSTGRES_USER: the image's own bootstrap/superuser role. Used only
#     for migrations (MIGRATIONS_DATABASE_URL) -- never by the running
#     application.
#   - APP_DB_USER: a restricted, NOSUPERUSER/NOBYPASSRLS role created by
#     infra/db/init/01-create-app-role.sh (the official postgres image's
#     own /docker-entrypoint-initdb.d mechanism, run once on first boot of
#     an empty data volume). This is what DATABASE_URL points at -- the
#     role the application actually runs as, and the one Row-Level
#     Security enforcement depends on being non-superuser.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Dev-only: the browser needs to reach this container directly for the
    # OIDC callback leg (GET /auth/callback -- a real browser navigation,
    # not something a reverse proxy can front in this topology, since dev
    # has no Caddy). `.env.example`'s OIDC_REDIRECT_URI already assumed
    # `http://localhost:8000/auth/callback`; this was the missing half of
    # that (docs/ADR/0023-... Phase 1 design audit finding). Never present
    # in docker-compose.prod.yml, where Caddy is the only published port.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # P2.1: the background-job worker (`api/worker.py`) -- the process that
  # actually executes what `infra.jobs.enqueue_job()` puts on Redis
  # (webhook delivery, usage ingestion, notification/email dispatch). Same
  # image and same non-root `app` user as `backend`, a different command;
  # publishes no host port (it serves no HTTP). `restart: unless-stopped`
  # because a worker that exits non-zero (Redis/PostgreSQL unreachable at
  # startup, unsafe database role) must be retried by the supervisor, not
  # left dead until an operator notices. The healthcheck reads the arq
  # health sentinel the running worker refreshes in Redis (see
  # api/worker.py) -- it proves the poll loop is alive, not merely that a
  # process exists. Queue durability is Redis's: this `redis` service has
  # no persistence configured, so queued/dead-lettered jobs do not survive
  # a Redis restart -- addressed separately from P2.1.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "api.worker"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "api.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Local self-hosted identity (docs/ADR/0023-..., Phase 1) --------------
  # A local, disposable ZITADEL instance so `docker compose up` needs no
  # ZITADEL Cloud account or other external OIDC provider. Dedicated
  # PostgreSQL (zitadel-db) -- never the SaaS-OS `db` service/database
  # (ADR-0023 S5: ZITADEL manages its own schema/migrations independently;
  # it must never join SaaS-OS's Alembic history). `backend`/`worker` are
  # deliberately NOT made to depend on `zitadel` here -- core/identity's own
  # OIDC discovery (core/identity/provider.py) is resolved lazily on first
  # `/auth/login`, not at process startup, so coupling backend's own
  # container-healthy signal to a service it doesn't need yet at startup
  # would be unnecessary startup-ordering coupling. None of this phase's
  # services are ever present in docker-compose.prod.yml.
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ZITADEL's own process image has no shell and no `chown`/`chmod` binary
  # (distroless-style) -- it cannot fix up permissions on the shared
  # `zitadel-bootstrap` volume itself, and it runs as a non-root user, so a
  # freshly created named volume (root-owned by default) makes its own
  # `ZITADEL_FIRSTINSTANCE_PATPATH` write fail with `permission denied`
  # (verified empirically against this pinned image/version -- not a
  # documented requirement, ZITADEL's own docs don't mention it). This
  # one-shot `busybox` init fixes that before `zitadel` ever starts.
  zitadel-bootstrap-vol-init:
    image: busybox
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - zitadel-bootstrap:/bootstrap

  zitadel:
    # Pinned exact version (never `latest`) -- v4.19.0, the current stable
    # release as of this phase's implementation; v4.18.0 immediately
    # preceding it is a known-bad release (its own setup step fails).
    image: ghcr.io/zitadel/zitadel:v4.19.0
    # `start-from-init` (init+setup+start collapsed into one command) is
    # this phase's deliberately simpler choice over the production-like
    # three-stage init/setup/start split -- that split is Phase 3's
    # concern (docs/ADR/0023-... S16), not local dev's.
    command: start-from-init --masterkey "${ZITADEL_LOCAL_MASTERKEY}" --tlsMode disabled
    environment:
      # Admin == User here (ZITADEL then skips creating a second Postgres
      # role) -- unlike the SaaS-OS `db` service's own POSTGRES_USER/
      # APP_DB_USER split, this collapse is safe: that split exists
      # specifically for PostgreSQL RLS enforcement (docker-compose.yml's
      # own header comment), which is irrelevant to ZITADEL's own schema.
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # ExternalDomain/-Port/-Secure is what the browser sees, what ends up
      # as the `iss` claim in issued tokens, AND (verified empirically --
      # see the `zitadel` service's own `networks.default.aliases` below)
      # what ZITADEL matches the request `Host` header against to resolve
      # which instance a call belongs to, for every caller, not just the
      # browser. It MUST match ZITADEL_ISSUER_URL (.env) exactly, or
      # core/identity/oidc.py's issuer check rejects every token (and
      # server-side calls 404 before that). ZITADEL_PORT (the container's
      # actual internal listen port, default 8080) is deliberately set
      # equal to ZITADEL_EXTERNALPORT/the host-published port below --
      # ZITADEL decouples the two by default (`ExternalPort` is purely
      # cosmetic, used in issued URLs), but this repo's local topology
      # needs one identical "host:port" pair reachable both from the host
      # (browser, via the published port) and from other containers (via
      # the network alias resolving straight to this container's real
      # listen port) -- keeping them equal is what makes that possible
      # without a reverse proxy in front of local ZITADEL (that's Phase 3).
      ZITADEL_PORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # Deterministic first-run bootstrap (ZITADEL's own supported
      # mechanism -- no custom provisioning). Org/admin names are fixed,
      # non-secret local identifiers; only the admin password is a secret,
      # sourced from .env.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: saas-os-local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # A machine user + Personal Access Token, IAM_OWNER-scoped, created
      # at bootstrap and written to ZITADEL_FIRSTINSTANCE_PATPATH -- the
      # credential `zitadel-bootstrap` (below) uses to create the SaaS-OS
      # OIDC application via ZITADEL's own Management API. The token value
      # itself is generated by ZITADEL, never supplied by this repo.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # ZITADEL v4 defaults new instances to "Login V2" -- a separate
      # Next.js UI shipped as its own `zitadel-login` image, which this
      # single-container local topology does not run (verified
      # empirically: without this, /ui/v2/login/login 404s, "no login
      # screen at all"). Falls back to the legacy login UI bundled inside
      # this same image (served at /ui/login) -- functionally equivalent
      # for local dev's purposes, one fewer moving part. Only takes effect
      # at first instance setup (ZITADEL_FIRSTINSTANCE_* convention).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports:
      # Local developer/browser convenience ONLY (ADR-0023 S8/S10) -- the
      # OIDC authorization-redirect leg is a real browser navigation, so
      # ZITADEL must be host-reachable in this topology (dev has no Caddy
      # path-proxy; that's Phase 3). Never present in
      # docker-compose.prod.yml -- production keeps ZITADEL private,
      # fronted by Caddy under the product's own domain.
      - "${ZITADEL_LOCAL_PORT}:${ZITADEL_LOCAL_PORT}"
    volumes:
      - zitadel-bootstrap:/bootstrap
    networks:
      default:
        # `zitadel.localhost` (the reserved .localhost TLD, RFC 6761)
        # resolves to 127.0.0.1 on the host with no /etc/hosts entry
        # needed (verified empirically on this host's own DNS resolver,
        # and standard modern-browser behavior) -- registering the exact
        # same name as this container's own Docker-network alias means
        # ZITADEL_ISSUER_URL (.env) can be one identical URL for both the
        # browser (host) and backend/zitadel-bootstrap (in-network),
        # avoiding the Host-header instance-routing 404 described above.
        aliases:
          - zitadel.localhost
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-vol-init:
        condition: service_completed_successfully
    healthcheck:
      # ZITADEL's own image has no shell (CMD-SHELL is unusable) and no
      # curl/wget -- `zitadel ready` is the binary's own supported
      # readiness probe, verified empirically to work correctly under
      # `--tlsMode disabled` against this pinned version (a TLS-probe bug
      # affecting some ZITADEL versions/configurations does not reproduce
      # here).
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # One-shot, idempotent (local-dev/bootstrap_zitadel.py: list-before-create
  # by name, safe to re-run on every `docker compose up`). Reuses the
  # `backend` image (already has python + httpx installed) rather than
  # adding a new build context -- runs once, exits, never restarts.
  zitadel-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "/local-dev/bootstrap_zitadel.py"]
    environment:
      # Same URL a browser on the host would use (see the `zitadel`
      # service's own `networks.default.aliases` comment above for why
      # that's required, not just convenient).
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
      - ./local-dev/bootstrap_zitadel.py:/local-dev/bootstrap_zitadel.py:ro
    depends_on:
      zitadel:
        condition: service_healthy

volumes:
  db-data:
  zitadel-db-data:
  zitadel-bootstrap:
