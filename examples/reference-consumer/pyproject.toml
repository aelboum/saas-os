[project]
name = "reference-consumer"
version = "0.0.0"
description = "SaaS OS ADR-0018 reference/validation fixture -- not a shipped package, not a real product."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: a pinned Git/VCS dependency on an exact
    # 40-character commit SHA, never a branch or a tag. The SHA below is a
    # real commit of this repository; `tests/test_consumer_pins_unit.py`
    # fails if it ever regresses to a placeholder, a tag or a branch name.
    # `saas-os-update` (docs/AUTO-UPDATE-CLI.md) is the supported way to
    # move it. See this directory's README.md for what installs from it.
    # STALE PIN -- 4fccc93 predates the `saas_os` import root (ADR-0038), the
    # worker's `extra_functions` seam (ADR-0039) and the optional extras
    # (ADR-0041). No commit containing them has been published, and this file
    # must not name an unpublished SHA. The code next to this manifest is
    # tested against a wheel built from the working tree, not against this
    # pin. Move it to the first published commit that contains this change.
    "saas-os @ git+https://github.com/aelboum/saas-os@4fccc9370f3acf82cbc03fedd5c3adbade223d97",
]
