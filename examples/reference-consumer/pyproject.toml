[project]
name = "reference-consumer"
version = "0.0.0"
description = "SaaS OS ADR-0018 reference/validation fixture -- not a shipped package, not a real product."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: a pinned Git/VCS dependency on an exact
    # 40-character commit SHA, never a branch or a tag. The SHA below is a
    # real commit of this repository; `tests/test_consumer_pins_unit.py`
    # fails if it ever regresses to a placeholder, a tag or a branch name.
    # `saas-os-update` (docs/AUTO-UPDATE-CLI.md) is the supported way to
    # move it. See this directory's README.md for what installs from it.
    # 3677c86 is `main` after pull request #21: the first published commit
    # with ADR-0045's platform authority complete (Phases B to F). Since
    # Phase C, `create_tenant`, `transition_tenant_status`, `move_tenant`
    # and the feature-flag mutations take a required `caller`, which this
    # code passes. It also carries everything 58d134f did: the `saas_os`
    # import root (ADR-0038), the worker's `extra_functions` seam
    # (ADR-0039) and the optional extras (ADR-0041). The code next to this
    # manifest is later than its pin by construction (a commit cannot name
    # its own SHA); CI tests it against a wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@3677c861a024985654019c7f0fa47e6cf1adbfe4",
]
