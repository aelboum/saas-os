[project]
name = "reference-consumer"
version = "0.0.0"
description = "SaaS OS ADR-0018 reference/validation fixture -- not a shipped package, not a real product."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: a pinned Git/VCS dependency on an exact
    # 40-character commit SHA, never a branch or a tag. The SHA below is a
    # real commit of this repository; `tests/test_consumer_pins_unit.py`
    # fails if it ever regresses to a placeholder, a tag or a branch name.
    # `saas-os-update` (docs/AUTO-UPDATE-CLI.md) is the supported way to
    # move it. See this directory's README.md for what installs from it.
    # 8e31cc0 is `main` after pull request #54 (2026-10-18): the entitlement
    # refusal of `run_inference` now writes a tenant audit row (7db23b7),
    # with ADR-0054 and ADR-0055 accepted. No migration, no signature this
    # code calls. Reviewed in docs/P-ROADMAP.md (`saas-os-update`:
    # REVIEW_REQUIRED: architecture, provider_boundary).
    # Before it, b30e369 is the 2026-10-18 release candidate after pull request #53:
    # governed AI inference (`saas_os.inference`, ADR-0054/0055/0056; used
    # by `reference_consumer/inference.py`) and the post-merge audit fixes.
    # Its migrations add the AI tables and the platform-configuration role
    # (docs/RUNBOOKS.md, "AI configuration role"); no signature this code
    # already called changed. Reviewed in docs/RELEASE-READINESS.md
    # (`saas-os-update`: REVIEW_REQUIRED).
    # Before it, 4197d2f is `main` after pull request #43: the payment page for a
    # subscription (ADR-0052, `POST .../payment-page` in the billing
    # router), and the Stripe adapter saves the card that pays the first
    # invoice for the renewals. No migration, no signature this code calls.
    # Since 26ec1de (#40): the Stripe adapter creates
    # a commercial subscription `incomplete` (pending until paid) instead of
    # being refused for a payer without a payment method, validated against
    # Stripe test mode. No migration, no signature this code calls.
    # Since 93b8002 (#38): receiving billing-provider
    # events (#33, ADR-0048, one additive migration), production hardening
    # (#34-#38: scheduled-job failures recorded, a limit on refused
    # credentials, an expiring identity bootstrap token, multi-factor login
    # for platform operators with one additive migration, ADR-0049, and the
    # `saas-os-operator` commands, ADR-0050). None changes a signature this
    # code calls. Since 6a71d70 (#31): a route can accept
    # an API key it opts in for (ADR-0047); #29
    # and #30 order platform audit pages by time and bound platform
    # mutations with a statement timeout. None adds a migration or changes
    # a signature this code calls. Since 9fd35b3 (#27): accepting an
    # invitation over HTTP (`invitation_acceptance_router`, ADR-0046) and
    # one additive migration. It also carries everything 8b5e458 did: since
    # #24, `purge_tenant` takes a required `caller` (the purge authority),
    # which this code passes; since #25, only a user linked to an external
    # identity can be enrolled as a platform operator; and from 3677c86: ADR-0045's platform authority, the required `caller` on tenant
    # lifecycle and feature-flag functions, the `saas_os` import root
    # (ADR-0038), the worker's `extra_functions` seam (ADR-0039) and the
    # optional extras (ADR-0041). The code next to this manifest is later
    # than its pin by construction (a commit cannot name its own SHA); CI
    # tests it against a wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@8e31cc01e204ad5b1065cec0e6e458fdbf33bf89",
]
