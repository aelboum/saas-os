[project]
name = "reference-consumer"
version = "0.0.0"
description = "SaaS OS ADR-0018 reference/validation fixture -- not a shipped package, not a real product."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: a pinned Git/VCS dependency on an exact
    # 40-character commit SHA, never a branch or a tag. The SHA below is a
    # real commit of this repository; `tests/test_consumer_pins_unit.py`
    # fails if it ever regresses to a placeholder, a tag or a branch name.
    # `saas-os-update` (docs/AUTO-UPDATE-CLI.md) is the supported way to
    # move it. See this directory's README.md for what installs from it.
    # 8b5e458 is `main` after pull request #25. Since #24, `purge_tenant`
    # takes a required `caller` (the purge authority), which this code
    # passes; since #25, only a user linked to an external identity can be
    # enrolled as a platform operator. It also carries everything 3677c86
    # did: ADR-0045's platform authority, the required `caller` on tenant
    # lifecycle and feature-flag functions, the `saas_os` import root
    # (ADR-0038), the worker's `extra_functions` seam (ADR-0039) and the
    # optional extras (ADR-0041). The code next to this manifest is later
    # than its pin by construction (a commit cannot name its own SHA); CI
    # tests it against a wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@8b5e4586cc438a518e16df648db8eeee1e169a48",
]
