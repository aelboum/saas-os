[project]
name = "my-product"
version = "0.1.0"
description = "A product built on SaaS OS. Rename me (see README.md)."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: exactly one dependency on SaaS OS, pinned to an
    # exact 40-character commit SHA -- never a branch or a tag. Move it
    # with `saas-os-update` (docs/AUTO-UPDATE-CLI.md), not by hand-editing
    # to a ref you have not reviewed.
    # 2158a81 is `main` after pull request #254 (2026-11-12), released as
    # v0.11.0 (CHANGELOG.md). Since 0f9bf4d (#235-#254): six migrations
    # (head c7d2a9f4e1b6), the governed AI inference follow-up (Gaps 20 to
    # 22: platform AI hold, usage reads, model ranking, price units, monthly
    # budget, usage rollup, the opt-in AI HTTP router) and new permissions
    # granted to no role. `saas-os-update check`: REVIEW_REQUIRED (43
    # commits, 98 changed paths; architecture, authorization, billing,
    # dependency toolchain, documentation, migration, provider boundary,
    # public API, tenant RLS, tests and unknown); the paths are listed in
    # docs/P-ROADMAP.md. The pinned-SHA install and import were checked for
    # this move on 2026-11-13; the tests were not rerun (same place).
    # Before it, 0f9bf4d is `main` after pull request #234 (2026-11-07), released as
    # v0.10.0 (CHANGELOG.md). Since fb08e47 (#226, #229, #231-#234): no
    # migration (head e2b7c4d9a1f6), `StrictEgressClient.get`, four new
    # `EmailMessage` header fields and `InvalidEmailHeaderError`.
    # `saas-os-update check`: REVIEW_REQUIRED (19 commits, 35 changed paths;
    # architecture, dependency toolchain, documentation, internal, public
    # API, security control and tests); the paths are listed in
    # docs/P-ROADMAP.md. The pinned-SHA install and import were checked for
    # this move on 2026-11-12; the tests were not rerun (same place).
    # Before it, fb08e47 is `main` after pull request #228 (2026-11-06), released as
    # v0.9.0 (CHANGELOG.md). Since 140d9dd (#220-#222, #227, #228): no
    # migration (head e2b7c4d9a1f6), platform audit rows of the permission
    # grant approver register store a random reference instead of the user
    # id, and `EmailOutcomeUnknownError` and `EmailNotSentError` are
    # exported from saas_os.core.email. `saas-os-update check`:
    # REVIEW_REQUIRED (11 commits, 26 changed paths; architecture,
    # dependency toolchain, documentation, internal, public API and tests);
    # the paths are listed in docs/P-ROADMAP.md. The pinned-SHA install and
    # import were checked for this move on 2026-11-07; the tests were not
    # rerun (same place).
    # Before it, 140d9dd is `main` after pull request #219 (2026-11-05), released as
    # v0.8.0 (CHANGELOG.md). Since ee2a64c (#214, #216, #218, #219): one
    # migration (e2b7c4d9a1f6, three new empty platform audit reference
    # tables), platform audit rows about a user store a random reference
    # instead of the user id, an outbox attempt with a started marker is
    # retried in two cases, and new base image digests. `saas-os-update
    # check`: REVIEW_REQUIRED (31 commits; architecture, authorization,
    # dependency toolchain, migration, public API, security control,
    # tenant RLS and others); the paths are listed in docs/P-ROADMAP.md.
    # The pinned-SHA install and import were checked for this move on
    # 2026-11-06; the tests were not rerun (same place).
    # Before it, ee2a64c is `main` after pull request #215 (2026-11-05), released as
    # v0.7.0 (CHANGELOG.md). Since d980e73 (#133, #186-#204, #207-#213, #215, #217): seven
    # migrations (head f0cc2e656d79), new platform permissions, `http://`
    # webhook destinations refused by default, system actor attribution
    # (a user initiator is refused in a new audit row), classified unknown
    # outcomes and an optional started marker in the outbox, and the permission
    # grant ledger. `saas-os-update check`: REVIEW_REQUIRED (220 commits;
    # architecture, authorization, migration, public API, security control,
    # tenant RLS and others); the paths are listed in docs/P-ROADMAP.md.
    # The pinned-SHA install and import were checked for this move on
    # 2026-11-05; the tests were not rerun (same place).
    # Before it, d980e73 is `main` after pull request #185 (2026-10-31), released as
    # v0.6.0 (CHANGELOG.md). Since b03d87a (#102-#185): one migration
    # (b3d5f7a9c2e4, a wider platform-permission check), the outbox
    # retry hint and replay, the egress proxy for webhooks and Resend,
    # API-key limits and signed release tags. `saas-os-update check`:
    # REVIEW_REQUIRED (212 commits; migration, authorization, public API,
    # security control, provider boundary and others); the paths are
    # listed in docs/P-ROADMAP.md. The pinned-SHA install and import were
    # checked for the move to d980e73 on 2026-11-05; the tests were not rerun.
    # Before it, b03d87a is `main` after pull request #101 (2026-10-23), released as
    # v0.5.0 (CHANGELOG.md). Since a313c59 (#94-#101): the public
    # tenant-purge participant API this code uses
    # (register_purge_participant), checked participant registration,
    # --no-product-participants audited, AuthorityNotAuthorizedError
    # public. No migration. `saas-os-update check`: REVIEW_REQUIRED
    # (tenancy, rbac, the operator CLI, ADR-0050, the version line and
    # the security-exceptions file); the review is docs/P-ROADMAP.md.
    # Before it, a313c59 is `main` after pull request #93 (2026-10-22), released as
    # v0.4.1 (CHANGELOG.md). Since 77c9a22 (#91-#93): the frontend locks
    # next 15.5.28 (GHSA-2464-fhr4-w9xw, GHSA-p3m5-59mp-jv5r) and the
    # release script retries GitHub's lagging lists. No migration, no
    # signature this code calls; this code does not use the frontend.
    # `saas-os-update check`: REVIEW_REQUIRED (the frontend manifest and
    # lockfile, the release script and the version line); the review is
    # docs/P-ROADMAP.md.
    # Before it, 77c9a22 is `main` after pull request #90 (2026-10-22), released as
    # v0.4.0 (CHANGELOG.md). Since 5905156 (#89-#90): deployment-level
    # email provider selection (ADR-0057: EMAIL_PROVIDER, Mailpit for
    # development, SMTP TLS required in production). No migration, no
    # signature this code calls; this code sets no EMAIL_PROVIDER and
    # sends no email through SMTP.
    # `saas-os-update check`: REVIEW_REQUIRED (the email package, the
    # worker, the development Compose file and the environment
    # templates); the review is docs/P-ROADMAP.md.
    # Before it, 5905156 is `main` after pull request #86 (2026-10-21), released as
    # v0.3.0 (CHANGELOG.md). Since 8e053be (#80-#86): the production
    # Compose file loads application settings from `.env.app`, the certifi
    # floor rises to 2026.10.19, `proxy` waits for a ready Login V2, and
    # publication waits for approval. No migration, no signature this code
    # calls; this code runs neither SaaS OS's Compose topology nor its
    # release tooling.
    # `saas-os-update check`: REVIEW_REQUIRED (the production Compose
    # file, the `deploy/` units, the CI and Release workflows, the
    # production check scripts and the environment templates); the review
    # is docs/P-ROADMAP.md.
    # Before it, 8e053be is `main` after pull request #79 (2026-10-21), released as
    # v0.2.0 (CHANGELOG.md). Since b0809ee (#72-#79): ZITADEL v4.19.5 with
    # a required Login V2 session-cookie secret, complete listings in the
    # identity bootstrap (#76) and the release tooling (#72-#74). No
    # migration, no signature this code calls; this code runs neither
    # SaaS OS's Compose topology nor its identity bootstrap.
    # `saas-os-update check`: REVIEW_REQUIRED (the Compose files, the Caddy
    # configuration, the identity bootstrap, the frontend lock file and
    # the release tooling); the review is docs/P-ROADMAP.md.
    # Before it, b0809ee is `main` after pull request #71 (2026-10-20), released as
    # v0.1.2 (CHANGELOG.md). Since c7d8987 (#66-#71): webhook delivery
    # has one 10-second deadline per attempt, resolves DNS off the event
    # loop, falls back to a second address and takes an optional
    # WEBHOOK_ALLOWED_PORTS (#70). No migration, no signature this code
    # calls; this code registers no webhook subscription.
    # `saas-os-update check`: REVIEW_REQUIRED (the webhook delivery files
    # of #70 and the version in pyproject.toml); the review is
    # docs/P-ROADMAP.md.
    # Before it, c7d8987 is `main` after pull request #65 (2026-10-19), released as
    # v0.1.1 (CHANGELOG.md). Since dab6357 (#62-#65): an exhausted
    # OpenAI-compatible account is provider_quota_exhausted, not
    # rate_limited, and trust entries are re-checked before every AI
    # attempt (#64); release labels and documentation. No migration, no
    # signature this code calls; this code does not use AI inference.
    # `saas-os-update check`: REVIEW_REQUIRED (the three inference files
    # of #64 and the version in pyproject.toml); the review is
    # docs/P-ROADMAP.md.
    # Before it, dab6357 is `main` after pull request #61 (2026-10-19), released as
    # v0.1.0 (CHANGELOG.md). Since 4197d2f (#44-#61): audit digests in
    # the worker's log (ADR-0053, one additive migration, a new system
    # job), audit rows for payment-page issuance and refusal (#51), and
    # governed AI inference (ADR-0054 to ADR-0056, five additive
    # migrations, opt-in; this code does not use it). The migration
    # f6a2c8e4b1d9 creates the platform-configuration role, so the
    # migration role needs CREATEROLE or the role must exist first.
    # No signature this code calls changed. `saas-os-update check`:
    # REVIEW_REQUIRED; the review is docs/CONSUMER-GUIDE.md section 14
    # and docs/P-ROADMAP.md.
    # Before it, 4197d2f is `main` after pull request #43: the payment page for a
    # subscription (ADR-0052, `POST .../payment-page` in the billing
    # router), and the Stripe adapter saves the card that pays the first
    # invoice for the renewals. No migration, no signature this code calls.
    # Since 26ec1de (#40): the Stripe adapter creates
    # a commercial subscription `incomplete` (pending until paid) instead of
    # being refused for a payer without a payment method, validated against
    # Stripe test mode. No migration, no signature this code calls.
    # Since 93b8002 (#38): receiving billing-provider
    # events (#33, ADR-0048, one additive migration), production hardening
    # (#34-#38: scheduled-job failures recorded, a limit on refused
    # credentials, an expiring identity bootstrap token, multi-factor login
    # for platform operators with one additive migration, ADR-0049, and the
    # `saas-os-operator` commands, ADR-0050). None changes a signature this
    # code calls. Since 6a71d70 (#31): a route can accept
    # an API key it opts in for (ADR-0047); #29
    # and #30 order platform audit pages by time and bound platform
    # mutations with a statement timeout. None adds a migration or changes
    # a signature this code calls. Since 9fd35b3 (#27): accepting an
    # invitation over HTTP (`invitation_acceptance_router`, ADR-0046) and
    # one additive migration. It also carries everything 8b5e458 did: since
    # #24, `purge_tenant` takes a required `caller` (the purge authority),
    # which this code passes; since #25, only a user linked to an external
    # identity can be enrolled as a platform operator; and from 3677c86: ADR-0045's platform authority, the required `caller` on tenant
    # lifecycle and feature-flag functions, the `saas_os` import root
    # (ADR-0038), the worker's `extra_functions` seam (ADR-0039) and the
    # optional extras (ADR-0041). The code next to this manifest is later
    # than its pin by construction (a commit cannot name its own SHA); CI
    # tests it against a wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@2158a8158f4f5044549de7d6eac3297fb15beba1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["my_product"]

[tool.setuptools.package-data]
my_product = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
