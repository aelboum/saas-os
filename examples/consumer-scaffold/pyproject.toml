[project]
name = "my-product"
version = "0.1.0"
description = "A product built on SaaS OS. Rename me (see README.md)."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: exactly one dependency on SaaS OS, pinned to an
    # exact 40-character commit SHA -- never a branch or a tag. Move it
    # with `saas-os-update` (docs/AUTO-UPDATE-CLI.md), not by hand-editing
    # to a ref you have not reviewed.
    # b0809ee is `main` after pull request #71 (2026-10-20), released as
    # v0.1.2 (CHANGELOG.md). Since c7d8987 (#66-#71): webhook delivery
    # has one 10-second deadline per attempt, resolves DNS off the event
    # loop, falls back to a second address and takes an optional
    # WEBHOOK_ALLOWED_PORTS (#70). No migration, no signature this code
    # calls; this code registers no webhook subscription.
    # `saas-os-update check`: REVIEW_REQUIRED (the webhook delivery files
    # of #70 and the version in pyproject.toml); the review is
    # docs/P-ROADMAP.md.
    # Before it, c7d8987 is `main` after pull request #65 (2026-10-19), released as
    # v0.1.1 (CHANGELOG.md). Since dab6357 (#62-#65): an exhausted
    # OpenAI-compatible account is provider_quota_exhausted, not
    # rate_limited, and trust entries are re-checked before every AI
    # attempt (#64); release labels and documentation. No migration, no
    # signature this code calls; this code does not use AI inference.
    # `saas-os-update check`: REVIEW_REQUIRED (the three inference files
    # of #64 and the version in pyproject.toml); the review is
    # docs/P-ROADMAP.md.
    # Before it, dab6357 is `main` after pull request #61 (2026-10-19), released as
    # v0.1.0 (CHANGELOG.md). Since 4197d2f (#44-#61): audit digests in
    # the worker's log (ADR-0053, one additive migration, a new system
    # job), audit rows for payment-page issuance and refusal (#51), and
    # governed AI inference (ADR-0054 to ADR-0056, five additive
    # migrations, opt-in; this code does not use it). The migration
    # f6a2c8e4b1d9 creates the platform-configuration role, so the
    # migration role needs CREATEROLE or the role must exist first.
    # No signature this code calls changed. `saas-os-update check`:
    # REVIEW_REQUIRED; the review is docs/CONSUMER-GUIDE.md section 14
    # and docs/P-ROADMAP.md.
    # Before it, 4197d2f is `main` after pull request #43: the payment page for a
    # subscription (ADR-0052, `POST .../payment-page` in the billing
    # router), and the Stripe adapter saves the card that pays the first
    # invoice for the renewals. No migration, no signature this code calls.
    # Since 26ec1de (#40): the Stripe adapter creates
    # a commercial subscription `incomplete` (pending until paid) instead of
    # being refused for a payer without a payment method, validated against
    # Stripe test mode. No migration, no signature this code calls.
    # Since 93b8002 (#38): receiving billing-provider
    # events (#33, ADR-0048, one additive migration), production hardening
    # (#34-#38: scheduled-job failures recorded, a limit on refused
    # credentials, an expiring identity bootstrap token, multi-factor login
    # for platform operators with one additive migration, ADR-0049, and the
    # `saas-os-operator` commands, ADR-0050). None changes a signature this
    # code calls. Since 6a71d70 (#31): a route can accept
    # an API key it opts in for (ADR-0047); #29
    # and #30 order platform audit pages by time and bound platform
    # mutations with a statement timeout. None adds a migration or changes
    # a signature this code calls. Since 9fd35b3 (#27): accepting an
    # invitation over HTTP (`invitation_acceptance_router`, ADR-0046) and
    # one additive migration. It also carries everything 8b5e458 did: since
    # #24, `purge_tenant` takes a required `caller` (the purge authority),
    # which this code passes; since #25, only a user linked to an external
    # identity can be enrolled as a platform operator; and from 3677c86: ADR-0045's platform authority, the required `caller` on tenant
    # lifecycle and feature-flag functions, the `saas_os` import root
    # (ADR-0038), the worker's `extra_functions` seam (ADR-0039) and the
    # optional extras (ADR-0041). The code next to this manifest is later
    # than its pin by construction (a commit cannot name its own SHA); CI
    # tests it against a wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@b0809eeb3448956a4dc85a5541514823ec9ceae7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["my_product"]

[tool.setuptools.package-data]
my_product = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
