[project]
name = "my-product"
version = "0.1.0"
description = "A product built on SaaS OS. Rename me (see README.md)."
requires-python = ">=3.13"
dependencies = [
    # ADR-0015 rules 7-8: exactly one dependency on SaaS OS, pinned to an
    # exact 40-character commit SHA -- never a branch or a tag. Move it
    # with `saas-os-update` (docs/AUTO-UPDATE-CLI.md), not by hand-editing
    # to a ref you have not reviewed.
    # 58d134f is the merge of pull request #6 into `main`: the first
    # published commit with the `saas_os` import root (ADR-0038), the
    # worker's `extra_functions` seam (ADR-0039) and the optional extras
    # (ADR-0041). The code next to this manifest is later than its pin by
    # construction (a commit cannot name its own SHA); CI tests it against a
    # wheel built from the working tree.
    "saas-os @ git+https://github.com/aelboum/saas-os@58d134ff12afdb28e9edd0309f2b1d4b5bc0bd49",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["my_product"]

[tool.setuptools.package-data]
my_product = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
